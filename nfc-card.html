<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shehab Amin | Digital Card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F3D3E;--gold:#F4B183;--sheet:#F4EFE6;--card:#FFFFFF;--ink:#0F2A2B;--muted:#5E6F6C;--line:#E6DFD2;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#0B1B1C;--card:#12292A;--ink:#F3EFE6;--muted:#9BB0AC;--line:#1F3A3B}}
:root[data-theme="dark"]{--sheet:#0B1B1C;--card:#12292A;--ink:#F3EFE6;--muted:#9BB0AC;--line:#1F3A3B}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sheet);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;min-height:100vh;background:var(--sheet)}
.hero{background:var(--navy);color:#fff;text-align:center;padding:calc(48px + env(safe-area-inset-top,0px)) 24px 84px;border-radius:0 0 40px 40px;position:relative;overflow:hidden}
.rings{position:absolute;left:50%;top:calc(110px + env(safe-area-inset-top,0px));width:0;height:0}
.rings i{position:absolute;border:1.5px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);opacity:0;animation:tap 3.6s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.2s}.rings i:nth-child(3){animation-delay:2.4s}
@keyframes tap{0%{width:124px;height:124px;opacity:.8}100%{width:380px;height:380px;opacity:0}}
.mono{position:relative;display:block;object-fit:cover;width:124px;height:124px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;margin:0 auto 22px;font-size:40px;font-weight:800;color:var(--gold);background:rgba(255,255,255,.06)}
h1{position:relative;margin:0;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.role{position:relative;display:inline-block;margin:14px 0 0;padding:6px 16px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:15px;font-weight:500}
.sheet{margin:-48px 16px 0;position:relative}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 10px;border-radius:16px;text-decoration:none;font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 20px rgba(15,61,62,.25)}
.wa{background:#1FA855}.call{background:var(--gold);color:var(--navy)}
.btn svg{width:22px;height:22px;fill:currentColor}
.list{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;transition:transform .15s}
.row:hover{transform:translateX(4px)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.ic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
.t{display:grid;line-height:1.25}.t b{font-size:18px}.t span{color:var(--muted);font-size:14px}
.row::after{content:"\203A";margin-left:auto;color:var(--muted);font-size:26px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:26px 0 30px}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rings i{animation:none}.row{transition:none}}

.hero{background-image:radial-gradient(circle at 85% 12%,rgba(244,177,131,.22),transparent 45%),radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.4px);background-size:auto,18px 18px}
.hero::before{content:"";position:absolute;left:-70px;bottom:-90px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.05)}
.mono{box-shadow:0 0 0 9px rgba(244,177,131,.18),0 14px 30px rgba(0,0,0,.35)}
.role{background:rgba(244,177,131,.12)}
.row{box-shadow:0 4px 14px rgba(15,61,62,.07)}
.ic{box-shadow:0 4px 10px rgba(0,0,0,.18)}
.btn{border-radius:18px}
.sheet{animation:rise .7s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
footer::before{content:"";display:block;width:36px;height:3px;border-radius:3px;background:var(--gold);margin:0 auto 14px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.sheet{animation:none}
.cta,.list li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.cta{animation-delay:.1s}
.list li:nth-child(1){animation-delay:.2s}.list li:nth-child(2){animation-delay:.28s}.list li:nth-child(3){animation-delay:.36s}.list li:nth-child(4){animation-delay:.44s}
.row:active,.btn:active{transform:scale(.98)}
.row:hover::after{color:var(--navy)}
.row::after{transition:transform .15s}.row:hover::after{transform:translateX(3px)}
.hero h1{text-shadow:0 2px 14px rgba(0,0,0,.25)}
.hero::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
@media (prefers-reduced-motion:reduce){.cta,.list li{animation:none}.row::after{transition:none}}

.tap{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);font-size:13px;font-weight:500;white-space:nowrap}
.tap svg{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2}
.hero::before{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sheen 1.4s ease-out 1.1s 1 both}
@keyframes sheen{to{left:130%}}
.hero h1{font-size:46px}
.hero{padding-top:calc(68px + env(safe-area-inset-top,0px))}
.rings{top:calc(130px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){.hero::before,.btn::after{animation:none}.btn::after{display:none}</style>
</head>
